<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Gym Weight Tracker</title>
    <meta name="description" content="Log your sets while you train and read back your workout history and personal records.">
    <meta name="theme-color" content="#08060A">
    <!-- Added to the home screen: full screen, the page drawn under the status bar -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gym Tracker">
    <style>
      * {
        box-sizing: border-box;
      }

      /* Night Floor from the first paint, so there is no white flash or white overscroll */
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: 'Nunito', sans-serif;
        background: #08060a;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
